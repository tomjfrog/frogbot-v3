name: "Frogbot Scan Pull Request"
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  pull-requests: write
  contents: read
  id-token: write
  # security-events: write  # enable with §8 GitHub Advanced Security stub
jobs:
  scan-pull-request:
    runs-on: ubuntu-latest
    # Protected GitHub Environment with required reviewers.
    # Required for public repos using pull_request_target.
    environment: frogbot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: jfrog/frogbot@v3
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_FAIL: "TRUE"
          JF_MIN_SEVERITY: "Medium"
          JF_INCLUDE_ALL_VULNERABILITIES: "FALSE"
        with:
          # Must match OIDC Provider Name on tomjpd
          oidc-provider-name: frogbot-demo
